name: hourly

on:
  schedule:
    - cron: "17 * * * *"   # every hour; GitHub may start it some minutes late
  workflow_dispatch:        # "Run workflow" button for a manual run
  push:
    branches: [main]
    paths: ["web/**", "*.py", ".github/workflows/**"]

permissions:
  contents: write   # push the data branch
  pages: write
  id-token: write

concurrency:
  group: hourly
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Stored forecasts and results live in the "data" branch, which holds a single
      # commit that is replaced every run, so the repository does not keep growing.
      - name: Get data branch
        run: |
          if git fetch --depth 1 origin data; then
            git worktree add --detach data FETCH_HEAD
          else
            git worktree add --detach data HEAD
            git -C data rm -rfq .
          fi

      - name: Collect forecasts and verify against radar
        run: python raincheck.py update

      # Finished days of raw data go to the permanent archive: one zip per day, attached to
      # a release per month ("archive-YYYY-MM"). A failed upload is retried next run.
      - name: Upload finished archive days
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          for f in data/archive/outbox/*.zip; do
            day=$(basename "$f" .zip); day=${day#raincheck-}
            rel="archive-${day:0:4}-${day:4:2}"
            gh release view "$rel" >/dev/null 2>&1 || gh release create "$rel" --latest=false \
              --title "Data archive ${day:0:4}-${day:4:2}" \
              --notes "Daily raw data files (forecasts, radar, station wind). Format: see archive.py."
            gh release upload "$rel" "$f" --clobber && rm "$f"
          done

      - name: Save data branch
        run: |
          cd data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q --orphan snapshot
          git add -A
          git commit -qm "data $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -fq origin HEAD:data

      - run: python raincheck.py build-site _site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
